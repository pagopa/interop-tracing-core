name: pagopa-interop-tracing
services:
  postgres:
    volumes:
      - ./tracing-store-db/init-db.sql:/docker-entrypoint-initdb.d/01-init-schema.sql
      - ./tracing-store-db/init-db-seed.sql:/docker-entrypoint-initdb.d/02-init-seed.sql
      - ./traces-db/init-db.sql:/docker-entrypoint-initdb.d/03-init-traces.sql
    image: postgres:14@sha256:bbb8851608e3ff4901156bf6a4bf90735a9d44ae014c03811bfdb2f9c354b18b
    ports:
      - 55000:5432
    environment:
      POSTGRES_DB: tracing_db
      POSTGRES_USER: mydbuser
      POSTGRES_PASSWORD: mypassword
    command: -c 'max_connections=512' -c 'wal_level=logical'

  zookeeper:
    image: quay.io/debezium/zookeeper:2.3@sha256:5b1354c4fa3bae600128eaa3ba9487ebd98b0aef40e3a39b32efe7533c8d2604

  kafka:
    image: quay.io/debezium/kafka:2.3@sha256:4009c39c2cc42686d1b5f0d2c46b3ff166e6ea98fb9a61d925b90f7fc56358e0
    ports:
      - 9092:9092
      - 29092:29092
    depends_on:
      - zookeeper
    environment:
      ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: LISTENER_DOCKER://kafka:29092,LISTENER_HOST://kafka:9092
      KAFKA_ADVERTISED_LISTENERS: LISTENER_DOCKER://kafka:29092,LISTENER_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: LISTENER_DOCKER:PLAINTEXT,LISTENER_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_DOCKER
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:53a6553765a806eda9905c43bfcfe09da6812035@sha256:7317d08c1d58f1c7e67adb936e3b181151bd5534a30b761f75fe8bddbf079ffd
    ports:
      - 8084:8080
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  s3-event-bridge:
    image: node:20-alpine
    command: ["node", "/app/index.js"]
    ports:
      - 5001:5001
    environment:
      PORT: 5001
      ELASTICMQ_URL: http://elasticmq:9324/000000000000
      BUCKET_QUEUE_MAP: '{"interop-tracing-bucket":"tracings-upload","interop-tracing-enriched-bucket":"enriched-upload","interop-tracing-errors-bucket":"errors-upload"}'
    volumes:
      - ./s3-event-bridge/index.js:/app/index.js:ro
    depends_on:
      - elasticmq
    restart: always

  # RustFS is a local S3-compatible storage, to replace AWS S3 in local development
  rustfs:
    image: rustfs/rustfs:1.0.0
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      RUSTFS_ACCESS_KEY: test-aws-key
      RUSTFS_SECRET_KEY: test-aws-secret
      RUSTFS_REGION: eu-central-1
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_NOTIFY_ENABLE: "true"
      RUSTFS_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: http://s3-event-bridge:5001/webhook/s3-event
      RUSTFS_NOTIFY_WEBHOOK_QUEUE_DIR_PRIMARY: /data/events
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: http://s3-event-bridge:5001
    volumes:
      - ./rustfs-data:/data
    depends_on:
      - s3-event-bridge
    restart: always

  # Seed buckets and event notifications for RustFS
  rustfs-seed:
    image: amazon/aws-cli:2.17.44
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: test-aws-key
      AWS_SECRET_ACCESS_KEY: test-aws-secret
      AWS_REGION: eu-central-1
      AWS_DEFAULT_REGION: eu-central-1
    entrypoint: >
      /bin/sh -c "
        until aws --endpoint-url http://rustfs:9000 s3 ls; do
          echo 'Waiting for RustFS to be ready...';
          sleep 1;
        done;
        echo 'RustFS is ready. Seeding buckets and notifications...';
        aws --endpoint-url http://rustfs:9000 s3 mb s3://interop-tracing-bucket || true;
        aws --endpoint-url http://rustfs:9000 s3 mb s3://interop-tracing-enriched-bucket || true;
        aws --endpoint-url http://rustfs:9000 s3 mb s3://interop-tracing-errors-bucket || true;
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-notification-configuration --bucket interop-tracing-bucket --notification-configuration file:///config/tracing-upload-notification.json;
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-notification-configuration --bucket interop-tracing-enriched-bucket --notification-configuration file:///config/enriched-upload-notification.json;
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-notification-configuration --bucket interop-tracing-errors-bucket --notification-configuration file:///config/errors-upload-notification.json;
      "
    volumes:
      - ./rustfs-config:/config:ro

  elasticmq: # ElasticMQ is a local SQS-compatible queue system, to replace AWS SQS in local development
    image: softwaremill/elasticmq-native:1.5.7@sha256:0cb5bcc04638c80af1631e8cf5da9b96b9fb6f46a4164462231065dc516c102f
    container_name: tracing-sqs
    ports:
      - 9324:9324
      - 9325:9325
    volumes:
      - ./elasticmq/elasticmq.local.conf:/opt/elasticmq.conf
    restart: always

  # PGAdmin is a web-based PostgreSQL admin interface, included for convenience
  pg-admin:
    image: dpage/pgadmin4:2024-04-01-1@sha256:00998d19a230b66e30de4bc00a2c453b07c63016dc15e58d6f6b4fa3c688d4e5
    ports:
      - 8082:80
    environment:
      PGADMIN_DEFAULT_EMAIL: root@example.com
      PGADMIN_DEFAULT_PASSWORD: example
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    restart: always
    volumes:
      - ./pg-servers.json:/pgadmin4/servers.json
      - ./pg-pass:/pgadmin4/pgpass
    # see https://stackoverflow.com/a/69475874/846273
    entrypoint: >
      /bin/sh -c "
      mkdir -m 700 /var/lib/pgadmin/storage/root_example.com;
      chown -R pgadmin:pgadmin /var/lib/pgadmin/storage/root_example.com;
      cp -prv /pgadmin4/pgpass /var/lib/pgadmin/storage/root_example.com/;
      chmod 600 /var/lib/pgadmin/storage/root_example.com/pgpass;
      /entrypoint.sh
      "

networks:
  develop-network:
    name: interop-tracing-develop-network
    driver: bridge
